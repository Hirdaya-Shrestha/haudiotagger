name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Default permissions for jobs that don't explicitly override them.
permissions:
  contents: write

jobs:
  # ============================================================
  # BUILD NATIVE ARTIFACTS
  # ============================================================
  build_and_upload:
    name: Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            path: haudiotagger/linux/libhaudiotagger.so

          - target: android
            os: ubuntu-latest
            path: |
              haudiotagger/android/src/main/jniLibs/arm64-v8a/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/armeabi-v7a/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/x86_64/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/x86/libhaudiotagger.so

          - target: windows
            os: windows-latest
            path: haudiotagger/windows/haudiotagger.dll

          - target: macos
            os: macos-latest
            path: haudiotagger/macos/Frameworks/haudiotagger.xcframework

          - target: ios
            os: macos-latest
            path: haudiotagger/ios/Frameworks/haudiotagger.xcframework

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup build environment
        uses: ./.github/actions/setup_build

      - name: Install MUSL dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: |
          dart run cli build ${{ matrix.target }} -v

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.path }}


  # ============================================================
  # BUILD WEB / WASM
  # ============================================================
  build_web:
    name: Build Web WASM

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haudiotagger/rust
          key: wasm

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: haudiotagger/rust
        run: |
          wasm-pack build --target web --release

      - name: Stage WASM files
        run: |
          mkdir -p haudiotagger/web/wasm

          cp haudiotagger/rust/pkg/haudiotagger_bg.wasm \
            haudiotagger/web/wasm/haudiotagger_bg.wasm

          cp haudiotagger/rust/pkg/haudiotagger.js \
            haudiotagger/web/wasm/haudiotagger.js

          cp haudiotagger/rust/pkg/haudiotagger_bg.wasm \
            haudiotagger_bg.wasm

          cp haudiotagger/rust/pkg/haudiotagger.js \
            haudiotagger.js

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            haudiotagger_bg.wasm
            haudiotagger.js

      # Upload the generated package directory too.
      # This lets the publish job receive exactly the files
      # generated above.
      - name: Upload package WASM
        uses: actions/upload-artifact@v4
        with:
          name: package-wasm
          path: |
            haudiotagger/web/wasm/haudiotagger.js
            haudiotagger/web/wasm/haudiotagger_bg.wasm


  # ============================================================
  # PUBLISH TO PUB.DEV
  # ============================================================
  publish:
    name: Publish to pub.dev

    needs:
      - build_and_upload
      - build_web

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Download package WASM
        uses: actions/download-artifact@v4
        with:
          name: package-wasm
          path: haudiotagger/web/wasm

      - name: Remove local Rust dependency
        working-directory: haudiotagger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text()

          text = text.replace(
              """  rust_lib_haudiotagger:
              path: rust_builder
          """,
              ""
          )

          path.write_text(text)
          PY

      - name: Get dependencies
        working-directory: haudiotagger
        run: flutter pub get

      - name: Validate package
        working-directory: haudiotagger
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: haudiotagger
        run: flutter pub publish --force

  # ============================================================
  # GITHUB RELEASE
  # ============================================================
  publish_to_release:
    name: Publish Artifacts to GitHub Release

    needs:
      - build_and_upload
      - build_web
      - publish

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ----------------------------------------------------------
      # Download all native artifacts.
      # ----------------------------------------------------------
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: ios

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      # ----------------------------------------------------------
      # Create archives.
      # ----------------------------------------------------------
      - name: Create archives
        shell: bash
        run: |
          tar -C linux -czvf linux.tar.gz .
          tar -C android -czvf android.tar.gz .
          tar -C windows -czvf windows.tar.gz .

          zip -j macos.zip macos/*

          cd ios
          zip -r ../ios.zip .
          cd ..

      # ----------------------------------------------------------
      # Create/update GitHub Release.
      # ----------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            linux.tar.gz
            android.tar.gz
            windows.tar.gz
            macos.zip
            ios.zip
            web/haudiotagger_bg.wasm
            web/haudiotagger.js
