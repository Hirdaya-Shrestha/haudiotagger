name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Default permissions for jobs that don't explicitly override them.
permissions:
  contents: write

jobs:
  # ============================================================
  # BUILD NATIVE ARTIFACTS
  # ============================================================
  build_and_upload:
    name: Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            path: haudiotagger/linux/libhaudiotagger.so

          - target: android
            os: ubuntu-latest
            path: |
              haudiotagger/android/src/main/jniLibs/arm64-v8a/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/armeabi-v7a/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/x86_64/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/x86/libhaudiotagger.so

          - target: windows
            os: windows-latest
            path: haudiotagger/windows/haudiotagger.dll

          - target: macos
            os: macos-latest
            path: haudiotagger/macos/Frameworks/haudiotagger.xcframework

          - target: ios
            os: macos-latest
            path: haudiotagger/ios/Frameworks/haudiotagger.xcframework

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup build environment
        uses: ./.github/actions/setup_build

      - name: Install MUSL dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: |
          dart run cli build ${{ matrix.target }} -v

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.path }}


  # ============================================================
  # BUILD WEB / WASM
  # ============================================================
  build_web:
    name: Build Web WASM

    runs-on: ubuntu-latest

    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      CARGO_TARGET_DIR: ${{ github.workspace }}/haudiotagger/rust/target
      RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-arg=--shared-memory -C link-arg=--import-memory -C link-arg=--max-memory=1073741824 -C link-arg=--export=__heap_base -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base -C link-arg=--export=__stack_pointer"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haudiotagger/rust
          key: wasm

      - name: Install wasm-bindgen-cli
        run: |
          curl -L https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz -o wb.tar.gz
          tar xzf wb.tar.gz
          echo "$PWD/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build WASM
        run: |
          cargo +nightly build --manifest-path haudiotagger/rust/Cargo.toml --target wasm32-unknown-unknown -Z build-std=std,panic_abort --release

      - name: Run wasm-bindgen
        run: |
          wasm-bindgen haudiotagger/rust/target/wasm32-unknown-unknown/release/haudiotagger.wasm --out-dir haudiotagger/rust/pkg --no-typescript --target no-modules

      - name: Stage WASM files
        run: |
          mkdir -p haudiotagger/pkg

          cp haudiotagger/rust/pkg/haudiotagger_bg.wasm \
            haudiotagger/pkg/haudiotagger_bg.wasm

          cp haudiotagger/rust/pkg/haudiotagger.js \
            haudiotagger/pkg/haudiotagger.js

          cp haudiotagger/rust/pkg/haudiotagger_bg.wasm \
            haudiotagger_bg.wasm

          cp haudiotagger/rust/pkg/haudiotagger.js \
            haudiotagger.js

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            haudiotagger_bg.wasm
            haudiotagger.js

      # Upload the generated package directory too.
      # This lets the publish job receive exactly the files
      # generated above.
      - name: Upload package WASM
        uses: actions/upload-artifact@v4
        with:
          name: package-wasm
          path: |
            haudiotagger/pkg/haudiotagger.js
            haudiotagger/pkg/haudiotagger_bg.wasm


  # ============================================================
  # PUBLISH TO PUB.DEV
  # ============================================================
  publish:
    name: Publish to pub.dev

    needs:
      - build_and_upload
      - build_web

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This is important for pub.dev OIDC authentication.
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Download package WASM
        uses: actions/download-artifact@v4
        with:
          name: package-wasm
          path: haudiotagger/pkg

      - name: Remove local Rust dependency
        working-directory: haudiotagger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text()

          old = """  rust_lib_haudiotagger:
              path: rust_builder
          """

          if old not in text:
              raise SystemExit(
                  "Could not find rust_lib_haudiotagger path dependency"
              )

          path.write_text(text.replace(old, ""))
          PY

          echo "Publish pubspec:"
          cat pubspec.yaml

      - name: Get dependencies
        working-directory: haudiotagger
        run: flutter pub get

      # - name: Validate package
      #   working-directory: haudiotagger
      #   run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: haudiotagger
        run: flutter pub publish --force

  # ============================================================
  # GITHUB RELEASE
  # ============================================================
  publish_to_release:
    name: Publish Artifacts to GitHub Release

    needs:
      - build_and_upload
      - build_web
      - publish

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ----------------------------------------------------------
      # Download all native artifacts.
      # ----------------------------------------------------------
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: ios

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      # ----------------------------------------------------------
      # Create archives.
      # ----------------------------------------------------------
      - name: Create archives
        shell: bash
        run: |
          tar -C linux -czvf linux.tar.gz .
          tar -C android -czvf android.tar.gz .
          tar -C windows -czvf windows.tar.gz .

          zip -j macos.zip macos/*

          cd ios
          zip -r ../ios.zip .
          cd ..

      # ----------------------------------------------------------
      # Create/update GitHub Release.
      # ----------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            linux.tar.gz
            android.tar.gz
            windows.tar.gz
            macos.zip
            ios.zip
            web/haudiotagger_bg.wasm
            web/haudiotagger.js
