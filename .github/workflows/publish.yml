name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # ============================================================
  # LINT
  # ============================================================
  rust_lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: flutter pub get
        run: cd haudiotagger && flutter pub get
      - name: Format
        run: cd haudiotagger/rust && cargo fmt --check
      - name: Clippy
        run: cd haudiotagger/rust && cargo clippy

  dart_lint:
    name: Dart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: cd haudiotagger && flutter pub get
      - name: Format
        working-directory: haudiotagger/lib/src
        run: dart format --set-exit-if-changed .
      - name: Lint
        working-directory: haudiotagger/lib/src
        run: dart analyze --fatal-infos
      - name: Format Example
        working-directory: haudiotagger/example/lib
        run: dart format --set-exit-if-changed .
      - name: Lint Example
        working-directory: haudiotagger/example/lib
        run: dart analyze --fatal-infos

  dart_cli_lint:
    name: Dart CLI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: cd cli && flutter pub get
      - name: Format
        working-directory: cli
        run: dart format --set-exit-if-changed .
      - name: Lint
        working-directory: cli
        run: dart analyze --fatal-infos

  # ============================================================
  # BUILD NATIVE ARTIFACTS
  # ============================================================
  build_and_upload:
    name: Build ${{ matrix.target }}
    needs: [rust_lint, dart_lint, dart_cli_lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            path: haudiotagger/linux/libhaudiotagger.so

          - target: android
            os: ubuntu-latest
            path: |
              haudiotagger/android/src/main/jniLibs/arm64-v8a/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/armeabi-v7a/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/x86_64/libhaudiotagger.so
              haudiotagger/android/src/main/jniLibs/x86/libhaudiotagger.so

          - target: windows
            os: windows-latest
            path: haudiotagger/windows/haudiotagger.dll

          - target: macos
            os: macos-latest
            path: haudiotagger/macos/Frameworks/haudiotagger.xcframework

          - target: ios
            os: macos-latest
            path: haudiotagger/ios/Frameworks/haudiotagger.xcframework

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
        working-directory: haudiotagger
      - run: cd cli && flutter pub get

      - name: Install MUSL dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: dart run cli build ${{ matrix.target }} -v

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.path }}

  # ============================================================
  # BUILD WEB / WASM
  # ============================================================
  build_web:
    name: Build Web WASM
    needs: [rust_lint, dart_lint, dart_cli_lint]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_UNSTABLE_BUILD_STD: std,panic_abort
      CARGO_TARGET_DIR: ${{ github.workspace }}/haudiotagger/rust/target
      RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-arg=--shared-memory -C link-arg=--import-memory -C link-arg=--max-memory=1073741824 -C link-arg=--export=__heap_base -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base -C link-arg=--export=__stack_pointer"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haudiotagger/rust
          key: wasm
      - name: Install wasm-bindgen-cli
        run: |
          curl -L https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz -o wb.tar.gz
          tar xzf wb.tar.gz
          echo "$PWD/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build WASM
        run: cargo +nightly build --manifest-path haudiotagger/rust/Cargo.toml --target wasm32-unknown-unknown -Z build-std=std,panic_abort --release
      - name: Run wasm-bindgen
        run: wasm-bindgen haudiotagger/rust/target/wasm32-unknown-unknown/release/haudiotagger.wasm --out-dir haudiotagger/rust/pkg --no-typescript --target no-modules
      - name: Stage WASM files
        run: |
          mkdir -p haudiotagger/pkg
          cp haudiotagger/rust/pkg/haudiotagger_bg.wasm haudiotagger/pkg/haudiotagger_bg.wasm
          cp haudiotagger/rust/pkg/haudiotagger.js haudiotagger/pkg/haudiotagger.js
          cp haudiotagger/rust/pkg/haudiotagger_bg.wasm haudiotagger_bg.wasm
          cp haudiotagger/rust/pkg/haudiotagger.js haudiotagger.js
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            haudiotagger_bg.wasm
            haudiotagger.js
      - name: Upload package WASM
        uses: actions/upload-artifact@v4
        with:
          name: package-wasm
          path: |
            haudiotagger/pkg/haudiotagger.js
            haudiotagger/pkg/haudiotagger_bg.wasm

  # ============================================================
  # PUBLISH TO PUB.DEV
  # ============================================================
  publish:
    name: Publish to pub.dev
    needs: [build_and_upload, build_web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dart-lang/setup-dart@v1

      - name: Download native artifacts (linux)
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: dl/linux

      - name: Download native artifacts (android)
        uses: actions/download-artifact@v4
        with:
          name: android
          path: dl/android

      - name: Download native artifacts (windows)
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dl/windows

      - name: Download native artifacts (macos)
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: dl/macos

      - name: Download native artifacts (ios)
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: dl/ios

      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-wasm
          path: dl/package-wasm

      - name: Stage fresh native + web artifacts into package
        shell: bash
        run: |
          set -e
          mkcp() {
            local d n dst found
            d="$1"; n="$2"; dst="$3"
            found=$(find "$d" -name "$n" | head -1)
            if [ -z "$found" ]; then echo "WARN: $n not found under $d"; return 0; fi
            mkdir -p "$(dirname "haudiotagger/$dst")"
            cp -r "$found" "haudiotagger/$dst"
            echo "staged $found -> haudiotagger/$dst"
          }
          mkcp dl/linux        libhaudiotagger.so        linux/libhaudiotagger.so
          mkcp dl/windows      haudiotagger.dll          windows/haudiotagger.dll
          mkcp dl/macos        haudiotagger.xcframework  macos/Frameworks/haudiotagger.xcframework
          mkcp dl/ios          haudiotagger.xcframework  ios/Frameworks/haudiotagger.xcframework
          mkcp dl/package-wasm haudiotagger.js           pkg/haudiotagger.js
          mkcp dl/package-wasm haudiotagger_bg.wasm      pkg/haudiotagger_bg.wasm
          while IFS= read -r f; do
            rel=${f#dl/android/}
            rel=${rel#haudiotagger/}
            mkdir -p "$(dirname "haudiotagger/$rel")"
            cp -r "$f" "haudiotagger/$rel"
            echo "staged $f -> haudiotagger/$rel"
          done < <(find dl/android -name 'libhaudiotagger.so')
          echo "Staged native/web artifacts"

      - name: Remove local Rust dependency
        working-directory: haudiotagger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text()

          old = """  rust_lib_haudiotagger:
              path: rust_builder
          """

          if old not in text:
              raise SystemExit(
                  "Could not find rust_lib_haudiotagger path dependency"
              )

          path.write_text(text.replace(old, ""))
          PY

          echo "Publish pubspec:"
          cat pubspec.yaml

      - name: Get dependencies
        working-directory: haudiotagger
        run: flutter pub get

      - name: Publish to pub.dev (OIDC)
        working-directory: haudiotagger
        run: flutter pub publish --force

  # ============================================================
  # GITHUB RELEASE
  # ============================================================
  publish_to_release:
    name: Publish Artifacts to GitHub Release
    needs: [build_and_upload, build_web, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: ios

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Create archives
        shell: bash
        run: |
          tar -C linux -czvf linux.tar.gz .
          tar -C android -czvf android.tar.gz .
          tar -C windows -czvf windows.tar.gz .
          zip -j macos.zip macos/*
          cd ios
          zip -r ../ios.zip .
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            linux.tar.gz
            android.tar.gz
            windows.tar.gz
            macos.zip
            ios.zip
            web/haudiotagger_bg.wasm
            web/haudiotagger.js
