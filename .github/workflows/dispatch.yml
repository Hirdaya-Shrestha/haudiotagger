name: Dispatch

# This public repo no longer runs CI/publish itself. It only forwards events to
# the PRIVATE haudiotagger-actions repo, which holds the real workflows (hidden).
#
#   push to main / any branch  -> repository_dispatch type "ci"   (private ci.yml)
#   push of a tag v*            -> workflow_dispatch publish.yml    (private repo)
#
# The publish must be a workflow_dispatch (not repository_dispatch): pub.dev OIDC
# only accepts tag- or workflow_dispatch-triggered runs, and the publish job runs
# in the private repo, so it is registered on pub.dev as haudiotagger-actions.
#
# Required secret (public repo): ACTIONS_DISPATCH_TOKEN = a PAT with `repo` scope
# that can send repository_dispatch / workflow_dispatch to the private repo.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - id: meta
        name: Decide event type
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "type=publish" >> "$GITHUB_OUTPUT"
          else
            echo "type=ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository Dispatch (CI)
        if: steps.meta.outputs.type == 'ci'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ACTIONS_DISPATCH_TOKEN }}
          repository: Hirdaya-Shrestha/haudiotagger-actions
          event-type: ci
          client-payload: >-
            {"ref": "${{ github.ref }}", "sha": "${{ github.sha }}",
             "repo": "${{ github.repository }}"}

      - name: Trigger publish (workflow_dispatch)
        if: steps.meta.outputs.type == 'publish'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACTIONS_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Hirdaya-Shrestha',
              repo: 'haudiotagger-actions',
              workflow_id: 'publish.yml',
              ref: 'main',
              inputs: {
                ref: context.ref,
                sha: context.sha,
                repo: context.repo.full_name
              }
            })
