name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust_lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: flutter pub get
        run: cd haudiotagger && flutter pub get
      - name: Format
        run: cd haudiotagger/rust && cargo fmt --check
      - name: Clippy
        run: cd haudiotagger/rust && cargo clippy

  dart_lint:
    name: Dart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: cd haudiotagger && flutter pub get
      - name: Format
        working-directory: haudiotagger/lib/src
        run: dart format --set-exit-if-changed .
      - name: Lint
        working-directory: haudiotagger/lib/src
        run: dart analyze --fatal-infos
      - name: Format Example
        working-directory: haudiotagger/example/lib
        run: dart format --set-exit-if-changed .
      - name: Lint Example
        working-directory: haudiotagger/example/lib
        run: dart analyze --fatal-infos

  dart_cli_lint:
    name: Dart CLI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: cd cli && flutter pub get
      - name: Format
        working-directory: cli
        run: dart format --set-exit-if-changed .
      - name: Lint
        working-directory: cli
        run: dart analyze --fatal-infos

  dispatch:
    name: Dispatch to private actions
    needs: [rust_lint, dart_lint, dart_cli_lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        name: Decide event type
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "type=publish" >> "$GITHUB_OUTPUT"
          else
            echo "type=ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository Dispatch (CI)
        if: steps.meta.outputs.type == 'ci'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ACTIONS_DISPATCH_TOKEN }}
          repository: Hirdaya-Shrestha/haudiotagger-actions
          event-type: ci
          client-payload: >-
            {"ref": "${{ github.ref }}", "sha": "${{ github.sha }}",
             "repo": "${{ github.repository }}"}

      - name: Trigger publish (workflow_dispatch)
        if: steps.meta.outputs.type == 'publish'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACTIONS_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Hirdaya-Shrestha',
              repo: 'haudiotagger-actions',
              workflow_id: 'publish.yml',
              ref: 'main',
              inputs: {
                ref: context.ref,
                sha: context.sha,
                repo: process.env.GITHUB_REPOSITORY
              }
            })
