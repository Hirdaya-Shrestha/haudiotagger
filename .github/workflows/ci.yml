name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  rust_lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: flutter pub get
        run: cd haudiotagger && flutter pub get
      - name: Format
        run: cd haudiotagger/rust && cargo fmt --check
      - name: Clippy
        run: cd haudiotagger/rust && cargo clippy

  dart_lint:
    name: Dart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: cd haudiotagger && flutter pub get
      - name: Format
        working-directory: haudiotagger/lib/src
        run: dart format --set-exit-if-changed .
      - name: Lint
        working-directory: haudiotagger/lib/src
        run: dart analyze --fatal-infos
      - name: Format Example
        working-directory: haudiotagger/example/lib
        run: dart format --set-exit-if-changed .
      - name: Lint Example
        working-directory: haudiotagger/example/lib
        run: dart analyze --fatal-infos

  dart_cli_lint:
    name: Dart CLI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: cd cli && flutter pub get
      - name: Format
        working-directory: cli
        run: dart format --set-exit-if-changed .
      - name: Lint
        working-directory: cli
        run: dart analyze --fatal-infos

  build:
    name: Build Libraries
    needs: [rust_lint, dart_lint, dart_cli_lint]
    strategy:
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
          - target: android
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup_build
      - name: Install MUSL dependencies
        if: ${{ matrix.target == 'linux' }}
        run: |
          sudo apt install musl-tools
      - name: Build
        run: dart run cli build ${{ matrix.target }} -v

  build_web:
    name: Build Web WASM
    needs: [rust_lint, dart_lint, dart_cli_lint]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-arg=--shared-memory -C link-arg=--import-memory -C link-arg=--max-memory=1073741824 -C link-arg=--export=__heap_base -C link-arg=--export=__wasm_init_tls -C link-arg=--export=__tls_size -C link-arg=--export=__tls_align -C link-arg=--export=__tls_base -C link-arg=--export=__stack_pointer"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: haudiotagger/rust
          key: wasm
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: cd haudiotagger/rust && wasm-pack build -t no-modules -d pkg --no-typescript --no-opt --release
