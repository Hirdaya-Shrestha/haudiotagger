name: rust_lib_haudiotagger
description: "Rust native library builder for haudiotagger — compiles lofty-based audio metadata reader/writer for Flutter."
version: 1.1.3
homepage: https://github.com/Hirdaya-Shrestha/haudiotagger
repository: https://github.com/Hirdaya-Shrestha/haudiotagger

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.6.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffi: ^2.0.2
  ffigen: ^11.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
