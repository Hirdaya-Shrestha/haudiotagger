[package]
name = "haudiotagger"
version = "2.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

# IMPORTANT: native (Android/iOS/Linux/macOS/Windows) builds must stay `panic = "unwind"`.
# flutter_rust_bridge 2.13's async FFI dispatcher relies on `catch_unwind`, which is
# unavailable under `panic = "abort"`. Do NOT add a `.cargo/config.toml` with
# `build-std = ["std", "panic_abort"]` or any cargokit option that rebuilds std with
# panic=abort — it rebuilds the native std that way and breaks async calls (abort at
# `frb_pde_ffi_dispatcher_primary`). The threaded WASM build scopes build-std/panic_abort
# to the wasm32 target only (via CI / `-Z build-std=std,panic_abort`), never to native.

[dependencies]
flutter_rust_bridge = "=2.13.0"
lofty = "0.25.4"
unicode-normalization = "0.1.24"
rayon = "1.10"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "Headers",
] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
anyhow = "1.0.68"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
