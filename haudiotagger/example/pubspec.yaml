name: haudiotagger_example
description: Demonstrates how to use the haudiotagger plugin.

publish_to: "none"

resolution: workspace
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  haudiotagger:
    path: ../

  cupertino_icons: ^1.0.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - ../web/wasm/haudiotagger_bg.wasm
    - ../web/wasm/haudiotagger.js
